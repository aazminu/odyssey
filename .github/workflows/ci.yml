name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  curriculum-dag-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run Odyssey curriculum DAG validation tests
        run: pytest scripts/test_curriculum_dag_validator.py -v
